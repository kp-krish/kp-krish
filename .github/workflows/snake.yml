name: Snake animation

# Generates the contribution-snake SVGs on your own runner and pushes them
# to the `output` branch. GitHub then serves the files, so nothing here can
# be rate-limited by a third party.

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 21:00 Phoenix time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: kp-krish
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}